<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flourish - AI Plant Care Companion</title>
    <meta name="description" content="Flourish is an AI plant care companion: track your garden, get smart watering and care schedules, ask PlantMind, and explore source-backed plant profiles." />
    <meta name="theme-color" content="#1A4231" />
    <link rel="canonical" href="https://flourish-web-iota.vercel.app/" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (LinkedIn, Facebook, Slack, WhatsApp). Crawlers don't run JavaScript,
         so these static tags - with ABSOLUTE urls - are what link previews actually read.
         Per-page title/description for browsers and Google come from components/Seo.tsx. -->
    <meta property="og:site_name" content="Flourish" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flourish-web-iota.vercel.app/" />
    <meta property="og:title" content="Flourish - AI Plant Care Companion" />
    <meta property="og:description" content="Track your garden, get smart care schedules, ask PlantMind, and explore source-backed plant profiles." />
    <meta property="og:image" content="https://flourish-web-iota.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Flourish - your AI plant care companion" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flourish - AI Plant Care Companion" />
    <meta name="twitter:description" content="Track your garden, get smart care schedules, ask PlantMind, and explore source-backed plant profiles." />
    <meta name="twitter:image" content="https://flourish-web-iota.vercel.app/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Flourish",
        "url": "https://flourish-web-iota.vercel.app/",
        "description": "AI plant care companion with care schedules, an AI assistant and a plant explorer.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any",
        "image": "https://flourish-web-iota.vercel.app/og-image.png",
        "author": { "@type": "Person", "name": "Rijusmit Biswas", "url": "https://rijusmit.vercel.app/" }
      }
    </script>

    <!-- Google Fonts: Outfit (UI/body) + Fraunces (headings/wordmark) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
