[project]
name = "api"
version = "0.1.0"
description = "Flourish Plant Care API - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.6.1",
    "httpx==0.27.2",
    "groq==0.4.1",
    "langchain-groq>=0.2",
    "langchain-tavily>=0.1",
    "langgraph>=0.2",
    "mcp>=1.2",
    "apscheduler>=3.10",
    "python-multipart==0.0.20",
    "python-jose[cryptography]==3.3.0",
    "requests==2.32.3",
    "firebase-admin==6.6.0",
    "websockets==14.1",
    "python-dotenv==1.0.1",
    "aiofiles==24.1.0",
    "pillow==11.0.0",
    "PyPDF2==3.0.1",
    "pytesseract>=0.3.13",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
markers = ["asyncio: mark a test as asyncio-based (handled by pytest-asyncio)"]

[tool.coverage.run]
source = ["api"]
omit = ["*/tests/*", "*/__pycache__/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
