name: Keep Render backend warm

# 5 minutes is the shortest interval GitHub Actions' schedule trigger reliably honors
# (its own docs: "the shortest interval you can run scheduled workflows is once every
# 5 minutes" - anything tighter gets silently delayed/dropped under load, and there's
# no way to hit a true 15s cadence from a cron-triggered workflow at all). This is also
# already well under Render free tier's 15-minute inactivity spin-down window, so it
# fully prevents the cold-start/scheduler-death problem - going faster wouldn't add
# any benefit, just more requests for nothing. See docs/02-Tech-Stack-Architecture.md §2.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    steps:
      - name: Check RENDER_API_URL is configured
        run: |
          if [ -z "${{ vars.RENDER_API_URL }}" ]; then
            echo "RENDER_API_URL repo variable is not set - skipping ping. Set it under Settings > Secrets and variables > Actions > Variables once the backend is deployed."
            exit 0
          fi

      - name: Ping backend health endpoint
        if: vars.RENDER_API_URL != ''
        run: |
          curl -fsS --max-time 20 "${{ vars.RENDER_API_URL }}/health" || echo "Ping failed - backend may be cold-starting or down."
