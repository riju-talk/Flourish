services:
  - type: web
    name: flourish-api
    env: python
    rootDir: apps/api
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: PLANT_ID_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      # Points at the Render "Secret File" mount path (e.g. /etc/secrets/<filename>),
      # not a literal key - upload the service-account JSON as a Secret File in the
      # Render dashboard, then set this to its mounted path. Never paste the raw JSON
      # into this file. See docs/02-Tech-Stack-Architecture.md §6.
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
