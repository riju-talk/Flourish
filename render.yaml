services:
  - type: web
    name: flourish-api
    env: python
    rootDir: apps/api
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "qwen/qwen3.6-27b"
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: PLANT_ID_API_KEY
        sync: false
      - key: UNSPLASH_APPLICATION_ID
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: UNSPLASH_SECRET_KEY
        sync: false
      # Firebase Admin credentials - individual service-account fields, no key file /
      # Secret File needed anywhere. Set each of these in the Render dashboard from
      # the downloaded JSON. FIREBASE_PRIVATE_KEY must keep its literal \n sequences
      # (paste it exactly as it appears in the JSON's "private_key" field, in quotes).
      # See docs/02-Tech-Stack-Architecture.md §6.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_CLIENT_X509_CERT_URL
        sync: false
      # Only needed if the project's "(default)" Firestore database isn't reachable
      # via the classic Firestore API (e.g. provisioned as Enterprise edition with
      # firestoreDataAccessMode disabled) - point this at a named Standard-edition
      # database instead. Omit to use "(default)".
      - key: FIRESTORE_DATABASE_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
